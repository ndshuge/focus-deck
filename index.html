<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f6f5f3"><title>Focus Deck · 专注学习</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","PingFang SC","Segoe UI",sans-serif;color:#242633;background:#f6f5f3;font-synthesis:none;--ink:#202438;--muted:#9294a1;--line:#e9e8ec;--violet:#7868cf;--r:26px}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 17% 0%,#eee9ff 0,transparent 36%),radial-gradient(circle at 100% 100%,#e7f4ef 0,transparent 36%),#f6f5f3}button,input{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible{outline:3px solid #9b8be7;outline-offset:3px}
.app{max-width:1450px;margin:auto;padding:32px clamp(18px,4.7vw,72px) 60px}.top{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:28px}.brand{display:flex;align-items:center;gap:12px;font-weight:750;letter-spacing:-.8px;font-size:23px}.mark{height:39px;width:39px;border-radius:14px;background:linear-gradient(145deg,#9a89e9,#6b5bbe);box-shadow:none;display:grid;place-items:center;color:white}.mark svg{width:23px;height:23px}.top-right{color:#6c6b7b;font-size:14px;display:flex;align-items:center;gap:12px}.avatar{width:39px;height:39px;border-radius:50%;display:grid;place-items:center;background:#e4ddff;color:#6953b7;font-weight:750}
.intro{display:flex;justify-content:space-between;align-items:end;margin-bottom:26px;gap:16px}.eyebrow{color:#8b80c3;font-size:14px;font-weight:650;margin:0 0 8px}.intro h1{margin:0;font-size:clamp(26px,2.5vw,32px);font-weight:740;letter-spacing:-1.5px}.intro p:last-child{color:#686676;font-size:15px;margin:10px 0 0}.date{color:#7d7d8b;font-size:14px;white-space:nowrap}
.layout{display:grid;grid-template-columns:minmax(0,1.23fr) minmax(340px,.86fr);gap:22px;align-items:start}.panel{background:#fff;border:1px solid #efedf2;box-shadow:0 1px 2px #35355106;border-radius:28px}.timer-panel{padding:28px 28px;min-height:610px;display:flex;align-items:center;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden}.timer-panel:before{content:"";position:absolute;width:280px;height:280px;border-radius:50%;background:radial-gradient(circle,#a89ae610,transparent 72%);top:24%;pointer-events:none}
.section-head{display:flex;justify-content:space-between;align-items:center;width:100%;gap:12px}.section-head h2{margin:0;font-size:19px;letter-spacing:-.5px}.quiet{color:#666477;font-size:13px}.mode-switch{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));width:245px;position:relative;background:#f1eff6;padding:5px;border:1px solid #eceaf2;border-radius:18px;margin-top:25px;gap:0;z-index:1;--active-offset:0%;-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}.mode-switch:before{content:"";position:absolute;top:5px;bottom:5px;left:5px;width:calc((100% - 10px)/3);border-radius:13px;background:#fff;box-shadow:0 1px 2px #35325112,0 0 0 1px #ffffffaa;transform:translateX(var(--active-offset));transition:transform .42s cubic-bezier(.22,1,.22,1),box-shadow .18s;pointer-events:none}.mode-switch button{border:0;background:transparent;position:relative;z-index:1;border-radius:12px;padding:10px 5px;color:#777284;font-size:14px;font-weight:600;min-height:44px;transition:color .25s}.mode-switch button.active{background:transparent;color:#4f428d}.mode-switch:has(button:active):before{box-shadow:0 1px 8px #7665be3d,inset 0 0 0 1px #fff}.mode-switch button:active{color:#4e3fa4}
.dial{position:relative;width:min(320px,86%);aspect-ratio:1;display:grid;place-items:center;margin:24px 0 6px}.dial svg{position:absolute;width:100%;height:100%;transform:rotate(-90deg)}.dial circle{fill:none;stroke-width:7}.track{stroke:#eeebf6}.progress{stroke:url(#ring);stroke-linecap:round;stroke-dasharray:879.65;stroke-dashoffset:0;transition:stroke-dashoffset .7s linear}.dial-inner{z-index:1;text-align:center}.time{font-size:clamp(54px,5.7vw,79px);font-weight:660;letter-spacing:-4px;font-variant-numeric:tabular-nums;line-height:1.1}.phase{font-size:13px;color:#756b91;margin-top:12px;font-weight:600}.timer-actions{display:flex;align-items:center;gap:12px;z-index:1;margin-top:12px}.primary{min-width:164px;height:54px;border:0;border-radius:18px;background:#7464c8;color:#fff;font-weight:680;box-shadow:none;transition:background .2s}.primary:hover{background:#6958be}.primary:active{background:#5b49ac}.round{height:54px;width:54px;border:1px solid #e9e6f1;border-radius:18px;background:#f6f4fa;color:#69667b;font-size:22px}.current-task{margin-top:20px;font-size:14px;color:#6f6b7b;text-align:center;max-width:100%;overflow-wrap:anywhere}.current-task strong{color:#5c527f}
.side{display:flex;flex-direction:column;gap:22px;min-width:0}.tasks{padding:27px}.add{display:grid;grid-template-columns:1fr auto;gap:9px;margin-top:22px}.add input{border:1px solid #ebe9f0;background:#f9f8fb;border-radius:14px;min-width:0;padding:13px 15px;font-size:14px}.add button{border:0;border-radius:14px;background:#ede9fa;color:#6857b8;font-weight:750;width:47px;min-height:46px;font-size:24px}.task-list{display:grid;gap:10px;margin-top:18px}.task{display:flex;align-items:center;gap:8px;background:#faf9fc;border:1px solid #f1eff6;padding:8px 8px;border-radius:16px;transition:transform .2s,background .2s}.task:hover{transform:translateY(-1px);background:#f5f1fc}.task.done .task-title{text-decoration:line-through;color:#b0adbc}.check{width:44px;height:44px;position:relative;border:0;background:transparent;flex-shrink:0;display:grid;place-items:center}.check::before{content:"";position:absolute;inset:10px;border:2px solid #d9d4e9;border-radius:7px;background:white}.check[aria-pressed="true"]::before{background:#8374d4;border-color:#8374d4}.check[aria-pressed="true"]::after{content:"✓";position:absolute;color:white;font-size:14px;font-weight:700}.task-title{flex:1;min-width:0;font-size:14px;font-weight:570;overflow-wrap:anywhere}.del{background:transparent;border:0;color:#827b92;min-width:44px;min-height:44px;font-size:20px}.empty{color:#9b98a7;padding:20px 6px;text-align:center;font-size:14px}
.stats{padding:25px 26px 28px}.stats-row{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:18px}.stat{background:#f8f7fb;border:0;border-radius:14px;padding:15px 12px}.stat span{display:block;color:#625f70;font-size:13px}.stat strong{font-size:27px;letter-spacing:-1px;font-weight:500;display:block;margin-top:10px;font-variant-numeric:tabular-nums}.stat small{font-size:13px;color:#625f70;font-weight:500}.chart-head{display:flex;align-items:center;justify-content:space-between;margin-top:29px}.chart-head h3{font-size:15px;margin:0}.chart-head span{color:#666477;font-size:13px}.bars{height:125px;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:clamp(8px,2vw,26px);margin-top:20px;align-items:end}.bar-col{height:100%;display:flex;flex-direction:column;justify-content:end;align-items:center;gap:12px}.bar{width:min(100%,44px);min-height:0;border-radius:10px 10px 6px 6px;background:linear-gradient(180deg,#a99ce9,#8273d4);transition:height .7s cubic-bezier(.2,.8,.2,1)}.bar-col span{font-size:12px;color:#a1a0ac}.footer{color:#aaa7b3;text-align:center;font-size:12px;margin-top:26px}
@media(max-width:880px){.layout{grid-template-columns:1fr}.side{grid-row:2}.timer-panel{min-height:500px}.stats{grid-column:auto}.date{display:none}}@media(max-width:520px){#sessionLabel{display:none}.app{padding:18px 16px 32px}.top{margin-bottom:20px}.intro{margin-bottom:16px}.intro h1{font-size:clamp(23px,6.4vw,26px);letter-spacing:-.9px}.intro p:last-child{font-size:13px;line-height:1.5}.panel{border-radius:25px}.timer-panel{padding:19px 17px 21px;min-height:420px}.mode-switch{margin-top:17px}.mode-switch button{padding:8px 5px}.dial{margin:12px 0 4px;width:min(248px,82%)}.time{font-size:clamp(53px,15vw,62px)}.timer-actions{margin-top:7px}.current-task{margin-top:14px}.tasks,.stats{padding:21px 18px}.stats-row{gap:8px}.stat{padding:15px 10px;border-radius:14px}.stat strong{font-size:25px}.stat span{font-size:12px}.stat small{font-size:11px}.bars{gap:8px}.top-right span{display:none}}
@media(prefers-reduced-transparency:reduce){.panel{background:#fff}.timer-panel:before{display:none}.mode-switch{background:#efedf4;-webkit-backdrop-filter:none;backdrop-filter:none}}
@media(prefers-contrast:more){:root{--muted:#4c4a58}.quiet,.date,.phase,.stat span,.stat small{color:#454257}.panel{border-color:#b9b4c5}.mode-switch{border-color:#a29cac}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{transition-duration:.01ms!important;animation-duration:.01ms!important;scroll-behavior:auto!important}}
</style></head><body><main class="app"><header class="top"><div class="brand"><div class="mark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5v5l3.5 2"/></svg></div>Focus Deck</div></header>
<section class="intro"><div><h1>给重要的事，一点完整时间。</h1><p>清理思绪，选择一件任务，然后开始。</p></div><div class="date" id="date"></div></section>
<div class="layout"><section class="panel timer-panel"><div class="section-head"><h2>专注计时</h2><span class="quiet" id="sessionLabel">空格开始 / 暂停</span></div><div class="mode-switch" role="group" aria-label="计时模式"><button class="active" data-mode="focus" title="25 分钟">专注</button><button data-mode="short" title="5 分钟">短休</button><button data-mode="long" title="15 分钟">长休</button></div><div class="dial"><svg viewBox="0 0 320 320" aria-hidden="true"><defs><linearGradient id="ring"><stop stop-color="#b5a6ee"/><stop offset="1" stop-color="#7264c8"/></linearGradient></defs><circle class="track" cx="160" cy="160" r="140"/><circle class="progress" id="ringProgress" cx="160" cy="160" r="140"/></svg><div class="dial-inner"><div class="time" id="clock" aria-live="off">25:00</div><div class="phase" id="phase">准备进入心流</div></div></div><div class="timer-actions"><button class="round" id="reset" aria-keyshortcuts="R" aria-label="重置计时器" title="重置">↺</button><button class="primary" id="toggle" aria-keyshortcuts="Space">开始专注</button></div><div class="current-task">当前任务：<strong id="currentTask">选择右侧任务开始</strong></div></section>
<div class="side"><section class="panel tasks"><div class="section-head"><h2>今天要做的事</h2><span class="quiet" id="taskCount">0 / 0 已完成</span></div><form class="add" id="taskForm"><input id="taskInput" aria-label="新任务" maxlength="100" placeholder="添加一个学习目标..." required><button type="submit" aria-label="添加任务">+</button></form><div class="task-list" id="taskList"></div></section>
<section class="panel stats"><div class="section-head"><h2>学习足迹</h2><span class="quiet">本地自动记录</span></div><div class="stats-row"><div class="stat"><span>今日专注</span><strong id="todayMinutes">0 <small>分钟</small></strong></div><div class="stat"><span>完成番茄钟</span><strong id="pomodoros">0 <small>次</small></strong></div><div class="stat"><span>已完成任务</span><strong id="finishedTasks">0 <small>项</small></strong></div></div><div class="chart-head"><h3>最近 7 天</h3><span>专注分钟数</span></div><div class="bars" id="weekly" role="img" aria-label="最近七天专注时长柱状图"></div></section></div></div><div class="footer">Focus Deck · 所有数据仅存储在此浏览器</div></main>
<script>
(function(){
'use strict';
const KEY='focus-deck-v1',durations={focus:1500,short:300,long:900};
const dateKey=d=>[d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-');
let data;try{data=JSON.parse(localStorage.getItem(KEY)||'{}')}catch{data={}}
data.tasks=Array.isArray(data.tasks)?data.tasks:[{id:1,title:'复习今天的课堂笔记',done:false},{id:2,title:'完成一组练习题',done:false},{id:3,title:'整理明天的学习计划',done:false}];
data.history=data.history&&typeof data.history==='object'?data.history:{};
data.pomodoros=Number(data.pomodoros)||0;
const savedTimer=data.timer&&typeof data.timer==='object'?data.timer:null;
let mode=savedTimer&&Object.hasOwn(durations,savedTimer.mode)?savedTimer.mode:'focus';
let remaining=Number.isFinite(savedTimer?.remaining)?Math.max(0,Math.min(durations[mode],Math.ceil(savedTimer.remaining))):durations[mode];
let running=false,endAt=0,interval=null;
let selected=data.tasks.some(t=>t.id===savedTimer?.selected&&!t.done)?savedTimer.selected:(data.tasks.find(t=>!t.done)?.id??null);
const el=id=>document.getElementById(id);
const store=()=>{try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){console.warn('Storage unavailable',e)}};
const persistTimer=()=>{data.timer={mode,remaining,running,endAt:running?endAt:0,selected};store()};
const clock=()=>{el('clock').textContent=String(Math.floor(remaining/60)).padStart(2,'0')+':'+String(remaining%60).padStart(2,'0');el('ringProgress').style.strokeDashoffset=String(879.65*(1-remaining/durations[mode]));document.title=el('clock').textContent+' · Focus Deck'};
const taskRender=()=>{const list=el('taskList');list.replaceChildren();if(!data.tasks.length){const p=document.createElement('div');p.className='empty';p.textContent='添加第一个任务，让今天有个好开始';list.append(p)}data.tasks.forEach(task=>{const item=document.createElement('div');item.className='task'+(task.done?' done':'');const check=document.createElement('button');check.className='check';check.setAttribute('aria-pressed',String(task.done));check.setAttribute('aria-label',task.done?'取消完成 '+task.title:'完成 '+task.title);check.onclick=()=>{task.done=!task.done;if(task.done&&selected===task.id)selected=data.tasks.find(t=>!t.done)?.id??null;persistTimer();render()};const title=document.createElement('button');title.className='task-title';title.style.cssText='text-align:left;border:0;background:none;padding:8px 0;cursor:pointer;color:inherit';title.textContent=task.title;title.setAttribute('aria-label','选择任务 '+task.title);title.setAttribute('aria-pressed',String(selected===task.id));title.disabled=task.done;title.onclick=()=>{if(task.done)return;selected=task.id;persistTimer();render()};if(selected===task.id&&!task.done)title.style.color='#6b59c3';const del=document.createElement('button');del.className='del';del.textContent='×';del.setAttribute('aria-label','删除 '+task.title);del.onclick=()=>{data.tasks=data.tasks.filter(t=>t.id!==task.id);if(selected===task.id)selected=data.tasks.find(t=>!t.done)?.id??null;persistTimer();render()};item.append(check,title,del);list.append(item)});el('taskCount').textContent=data.tasks.filter(t=>t.done).length+' / '+data.tasks.length+' 已完成';el('currentTask').textContent=data.tasks.find(t=>t.id===selected)?.title||'选择任务开始'};
const stats=()=>{const today=data.history[dateKey(new Date())]||0;el('todayMinutes').innerHTML=String(today)+' <small>分钟</small>';el('pomodoros').innerHTML=String(data.pomodoros)+' <small>次</small>';el('finishedTasks').innerHTML=String(data.tasks.filter(t=>t.done).length)+' <small>项</small>';const items=[];for(let i=6;i>=0;i--){const d=new Date();d.setHours(12,0,0,0);d.setDate(d.getDate()-i);items.push({day:['日','一','二','三','四','五','六'][d.getDay()],count:data.history[dateKey(d)]||0})}const max=Math.max(60,...items.map(x=>x.count));el('weekly').replaceChildren();items.forEach(x=>{const col=document.createElement('div');col.className='bar-col';const bar=document.createElement('div');bar.className='bar';bar.style.height=(x.count>0?Math.max(4,x.count/max*110):0)+'px';bar.title=x.count+' 分钟';const day=document.createElement('span');day.textContent='周'+x.day;col.append(bar,day);el('weekly').append(col)});el('weekly').setAttribute('aria-label',items.map(x=>'周'+x.day+x.count+'分钟').join('，'))};
const render=()=>{taskRender();stats();clock()};
const stop=()=>{running=false;if(interval)clearInterval(interval);interval=null;endAt=0;el('toggle').textContent=mode==='focus'?'开始专注':'开始休息'};
const finish=()=>{if(!running)return;const completedAt=new Date(endAt);stop();remaining=0;if(mode==='focus'){data.pomodoros++;const day=dateKey(completedAt);data.history[day]=(data.history[day]||0)+25;stats()}persistTimer();el('phase').textContent=mode==='focus'?'做得很好，休息一下吧':'休息结束，准备继续';el('toggle').textContent='重新开始';clock()};
const tick=()=>{if(!running)return;remaining=Math.max(0,Math.ceil((endAt-Date.now())/1000));if(remaining===0)finish();else clock()};
el('toggle').onclick=()=>{if(running){tick();if(!running)return;stop();el('phase').textContent='已暂停，按自己的节奏来';el('toggle').textContent='继续'+(mode==='focus'?'专注':'休息');persistTimer();clock()}else{if(remaining<=0)remaining=durations[mode];running=true;endAt=Date.now()+remaining*1000;persistTimer();interval=setInterval(tick,250);el('toggle').textContent='暂停';el('phase').textContent=mode==='focus'?'保持专注，你正在前进':'现在可以放松一下';tick()}};
el('reset').onclick=()=>{stop();remaining=durations[mode];el('phase').textContent='准备进入心流';persistTimer();clock()};
document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{stop();mode=b.dataset.mode;remaining=durations[mode];document.querySelectorAll('[data-mode]').forEach(x=>{x.classList.toggle('active',x===b);x.setAttribute('aria-pressed',String(x===b))});document.querySelector('.mode-switch').style.setProperty('--active-offset',({focus:'0%',short:'100%',long:'200%'})[mode]);el('phase').textContent=mode==='focus'?'准备进入心流':'给自己一点恢复时间';el('toggle').textContent=mode==='focus'?'开始专注':'开始休息';persistTimer();clock()});
el('taskForm').onsubmit=e=>{e.preventDefault();const title=el('taskInput').value.trim();if(!title)return;const id=Date.now()+Math.random();data.tasks.push({id,title,done:false});selected=id;el('taskInput').value='';persistTimer();render()};
el('date').textContent=new Intl.DateTimeFormat('zh-CN',{month:'long',day:'numeric',weekday:'long'}).format(new Date());
document.addEventListener('visibilitychange',tick);
// Quick keys only when the page itself owns focus. Never steal typing or button activation.
document.addEventListener('keydown',e=>{if(e.repeat||e.altKey||e.ctrlKey||e.metaKey||e.isComposing)return;if(e.target instanceof HTMLElement&&e.target.closest('button,input,textarea,select,[contenteditable]'))return;if(e.code==='Space'){e.preventDefault();el('toggle').click()}else if(e.code==='KeyR'){e.preventDefault();el('reset').click()}});
document.querySelectorAll('[data-mode]').forEach(b=>{b.classList.toggle('active',b.dataset.mode===mode);b.setAttribute('aria-pressed',String(b.dataset.mode===mode))});document.querySelector('.mode-switch').style.setProperty('--active-offset',({focus:'0%',short:'100%',long:'200%'})[mode]);
render();
if(savedTimer?.running&&Number.isFinite(savedTimer.endAt)&&savedTimer.endAt>0){
  running=true;endAt=savedTimer.endAt;tick();
  if(running){interval=setInterval(tick,250);el('toggle').textContent='暂停';el('phase').textContent='已恢复上次计时，继续保持专注'}
}else if(savedTimer&&remaining<durations[mode]&&remaining>0){
  el('toggle').textContent='继续'+(mode==='focus'?'专注':'休息');
  el('phase').textContent='已恢复上次进度，可随时继续';
}else if(savedTimer&&remaining===0){el('toggle').textContent='重新开始'}

})();
</script></body></html>
